name: XAIVideo
options:
  bundleIdPrefix: com.xmedia
  deploymentTarget:
    iOS: "15.0"
targets:
  XAIVideo:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: X AI Video
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsArbitraryLoadsInWebContent: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: "ເຊື່ອມຕໍ່ກັບໂປຣແກຣມ X Media AI Video ໃນຄອມພິວເຕີ (Connect to X Media AI Video on your computer)"
        NSCameraUsageDescription: "ຖ່າຍຄລິບ ຫຼື ຮູບ ເພື່ອຕັດຕໍ່ (Record clips or photos to edit)"
        NSMicrophoneUsageDescription: "ບັນທຶກສຽງຕອນຖ່າຍຄລິບ (Record sound with your clips)"
        NSPhotoLibraryUsageDescription: "ເລືອກຄລິບ ແລະ ຮູບ ຈາກ Photos (Pick clips and photos)"
        NSPhotoLibraryAddUsageDescription: "ບັນທຶກວິດີໂອທີ່ຕັດຕໍ່ແລ້ວລົງ Photos (Save finished videos to Photos)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xmedia.aivideo
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
